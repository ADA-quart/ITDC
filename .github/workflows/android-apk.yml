name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 本项目的 APK 用 debug 密钥签名，适合个人使用与测试，不适合上架应用商店。
# 若要正式分发，请配置 release 签名并改用 assembleRelease。

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install dependencies
        run: npm ci

      - name: Type check and test
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Build web app + sync to android
        run: npm run android:sync

      # 用固定的密钥签名，否则每个 Release 的签名都不同，用户无法覆盖升级。
      # 密钥来自仓库 Secret，不落盘到仓库里。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，回退到临时 debug 密钥。本次产出的 APK 与其它版本签名不同，无法覆盖升级。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/itdc.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/itdc.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "已还原签名密钥"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | head -3

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/itdc-${GITHUB_REF_NAME//\//-}.apk"
          ls -lh out

      - name: Upload as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: itdc-android-apk
          path: out/*.apk
          retention-days: 7

      # 打 tag（如 v1.4.0）时自动创建 Release 并附上 APK
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            > APK 使用 **debug 签名**，适用于个人使用与测试，不适合上架应用商店。

            **安装**：下载下方 Assets 中的 APK，首次安装需允许「未知来源」。

            **升级**：通常可直接覆盖安装，本地数据保留。若该版本涉及包名调整则需先卸载重装，
            请查看下方变更日志确认。

            **小组件不刷新时**：将「设置 → 应用 → ITDC → 省电策略」设为**无限制**
            （澎湃 OS / MIUI 等国产 ROM 默认限制后台）。

            完整变更见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
