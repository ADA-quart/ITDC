name: Notify profile repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-profile
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check profile token
        id: token
        shell: bash
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
        run: |
          if [ -z "$PROFILE_REPO_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROFILE_REPO_TOKEN 未配置，跳过主页刷新通知。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch profile refresh
        if: steps.token.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROFILE_REPO_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'ADA-quart',
              repo: 'ADA-quart',
              event_type: 'contribution-updated',
              client_payload: {
                source_repo: context.repo.owner + '/' + context.repo.repo,
                source_sha: context.sha
              }
            })
