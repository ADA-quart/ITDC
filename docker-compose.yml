services:
  itdc:
    build: .
    container_name: itdc
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # 必填：openssl rand -hex 32 生成，留空时生产模式会拒绝启动
      - CRYPTO_SECRET=${CRYPTO_SECRET:?set CRYPTO_SECRET in .env}
      # 云端前端域名白名单（逗号分隔）；纯内网可留空
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DB_PATH=/app/data/calendar.db
    volumes:
      - itdc_data:/app/data
    restart: unless-stopped

volumes:
  itdc_data:
